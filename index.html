let cat="",lev="",player="",list=[],idx=0,points=0,right=0,done=false;
const $=id=>document.getElementById(id);
categories.forEach(c=>{let b=document.createElement("button");b.className="cat";b.textContent=c[1]+" "+c[0];b.onclick=()=>{cat=c[0];document.querySelectorAll(".cat").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");document.body.dataset.theme=c[2];update()};$("cats").appendChild(b)});
function level(x,b){lev=x;document.querySelectorAll(".lev").forEach(y=>y.classList.remove("sel"));b.classList.add("sel");update()}
function update(){$("selected").textContent=(cat||"Category चुनो")+" | "+(lev||"Level चुनो")}
function board(){let a=[];try{a=JSON.parse(localStorage.getItem("gspQuizBoard")||"[]")}catch(e){}a.sort((x,y)=>y.points-x.points);$("board").innerHTML="";if(!a.length){$("board").innerHTML='<tr><td colspan="3">अभी कोई स्कोर नहीं। पहला Quiz खेलो!</td></tr>';return}a.slice(0,10).forEach((p,i)=>{let tr=document.createElement("tr");[i+1,p.name,p.points].forEach(v=>{let td=document.createElement("td");td.textContent=v;tr.appendChild(td)});$("board").appendChild(tr)})}
function start(){player=$("name").value.trim();if(!player)return alert("पहले अपना नाम लिखो।");if(!cat||!lev)return alert("Category और Level दोनों चुनो।");list=[...data[cat]].sort(()=>Math.random()-.5);idx=0;points=0;right=0;$("home").classList.add("hidden");$("result").classList.add("hidden");$("game").classList.remove("hidden");show()}
function show(){done=false;let q=list[idx];$("info").textContent=cat+" • "+lev+" • प्रश्न "+(idx+1)+"/20";$("question").textContent=q[0];$("answers").innerHTML="";$("feedback").textContent="";$("next").classList.add("hidden");
let opts=[{t:q[1],ok:true},...q.slice(2).map(t=>({t,ok:false}))].sort(()=>Math.random()-.5);
opts.forEach((o,i)=>{let b=document.createElement("button");b.className="opt";b.textContent=String.fromCharCode(65+i)+". "+o.t;b.onclick=()=>answer(b,o.ok,opts);$("answers").appendChild(b)})}
function answer(btn,ok,opts){if(done)return;done=true;document.querySelectorAll(".opt").forEach(b=>b.disabled=true);if(ok){points+=10;right++;btn.classList.add("good");$("feedback").textContent="✅ सही जवाब! +10 Points"}else{btn.classList.add("bad");let correct=opts.find(x=>x.ok).t;$("feedback").textContent="❌ गलत जवाब। सही उत्तर: "+correct;document.querySelectorAll(".opt").forEach(b=>{if(b.textContent.slice(3)===correct)b.classList.add("good")})}$("next").classList.remove("hidden");$("next").textContent=idx===19?"RESULT देखें":"NEXT QUESTION ➜"}
function next(){idx++;if(idx<20)show();else finish()}
function finish(){ $("game").classList.add("hidden");$("result").classList.remove("hidden");$("score").textContent=points+" / 200 Points";$("right").textContent=player+" • "+right+" सही उत्तर / 20";let a=[];try{a=JSON.parse(localStorage.getItem("gspQuizBoard")||"[]")}catch(e){}let k=player.toLowerCase(),p=a.find(x=>x.key===k);if(p)p.points+=points;else a.push({key:k,name:player,points});a.sort((x,y)=>y.points-x.points);localStorage.setItem("gspQuizBoard",JSON.stringify(a.slice(0,100)));board()}
function home(){$("result").classList.add("hidden");$("home").classList.remove("hidden");document.body.dataset.theme="home";cat="";lev="";document.querySelectorAll(".cat,.lev").forEach(x=>x.classList.remove("sel"));update()}
board();
</script></body></html>
