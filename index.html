// QUIZ SYSTEM

let scoreSaveStarted = false;

function shuffleArray(array) {
  const result = [...array];

  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }

  return result;
}

const categoryNames = {
  freefire: "FREE FIRE",
  freefireindia: "FREE FIRE INDIA",
  cricket: "CRICKET",
  bts: "BTS",
  movies: "MOVIES",
  gk: "GENERAL KNOWLEDGE"
};

function startQuiz(category) {
  if (!currentUser) {
    alert("पहले Google से Login करें!");
    return;
  }

  if (!quizData[category]) {
    alert("Category नहीं मिली!");
    return;
  }

  const choice = prompt(
    "Difficulty चुनें:\n\n1 = Easy (5 Questions)\n2 = Medium (10 Questions)\n3 = Hard (20 Questions)"
  );

  if (choice === null) return;

  const options = {
    "1": { name: "easy", count: 5 },
    "2": { name: "medium", count: 10 },
    "3": { name: "hard", count: 20 }
  };

  const selected = options[choice.trim()];

  if (!selected) {
    alert("कृपया 1, 2 या 3 चुनें!");
    return;
  }

  const pool = quizData[category][selected.name];

  if (!pool || pool.length < selected.count) {
    alert("Questions उपलब्ध नहीं हैं!");
    return;
  }

  currentQuestions = shuffleArray(pool)
    .slice(0, selected.count)
    .map((item) => ({
      question: item.question,
      answer: item.answer,
      options: shuffleArray(item.options)
    }));

  currentQuestionIndex = 0;
  score = 0;
  correctAnswers = 0;
  selectedAnswer = null;
  totalQuestions = selected.count;
  currentCategory = category;
  currentDifficulty = selected.name;
  quizFinished = false;
  scoreSaveStarted = false;

  document.getElementById("homeSection").style.display = "none";
  document.getElementById("quizSection").style.display = "block";
  document.getElementById("resultSection").style.display = "none";

  showQuestion();
}

function showQuestion() {
  if (currentQuestionIndex >= totalQuestions) {
    finishQuiz();
    return;
  }

  selectedAnswer = null;

  const question = currentQuestions[currentQuestionIndex];

  document.getElementById("quizCategory").textContent =
    categoryNames[currentCategory] + " - " +
    currentDifficulty.toUpperCase();

  document.getElementById("questionCounter").textContent =
    "Question " + (currentQuestionIndex + 1) +
    " / " + totalQuestions;

  document.getElementById("quizScore").textContent =
    "Score: " + score;

  document.getElementById("progressBar").style.width =
    (currentQuestionIndex / totalQuestions * 100) + "%";

  document.getElementById("questionText").textContent =
    question.question;

  const container =
    document.getElementById("optionsContainer");

  container.innerHTML = "";

  question.options.forEach((option, index) => {
    const button = document.createElement("button");

    button.type = "button";
    button.className = "option-btn";
    button.textContent = option;

    button.addEventListener("click", () => {
      selectAnswer(index);
    });

    container.appendChild(button);
  });

  const nextBtn = document.getElementById("nextBtn");
  nextBtn.disabled = true;
  nextBtn.textContent =
    currentQuestionIndex === totalQuestions - 1
      ? "See Result →"
      : "Next Question →";
}

function selectAnswer(index) {
  if (selectedAnswer !== null || quizFinished) return;

  selectedAnswer = index;

  const question = currentQuestions[currentQuestionIndex];
  const selectedOption = question.options[index];

  const buttons = document.querySelectorAll(
    "#optionsContainer .option-btn"
  );

  buttons.forEach((button, buttonIndex) => {
    button.disabled = true;

    const option = question.options[buttonIndex];

    if (option === question.answer) {
      button.classList.add("correct");
    }

    if (
      buttonIndex === index &&
      option !== question.answer
    ) {
      button.classList.add("wrong");
    }
  });

  if (selectedOption === question.answer) {
    score += 10;
    correctAnswers++;
  }

  document.getElementById("quizScore").textContent =
    "Score: " + score;

  document.getElementById("nextBtn").disabled = false;
}

function nextQuestion() {
  if (selectedAnswer === null) return;

  currentQuestionIndex++;

  if (currentQuestionIndex >= totalQuestions) {
    finishQuiz();
  } else {
    showQuestion();
  }
}

function finishQuiz() {
  if (quizFinished) return;

  quizFinished = true;

  document.getElementById("quizSection").style.display = "none";
  document.getElementById("resultSection").style.display = "block";

  document.getElementById("finalScore").textContent =
    score + " Points";

  document.getElementById("correctCount").textContent =
    correctAnswers + " / " + totalQuestions +
    " Correct Answers";

  document.getElementById("progressBar").style.width = "100%";

  const message = document.getElementById("resultMessage");

  if (correctAnswers === totalQuestions) {
    message.textContent = "🏆 Perfect Score! Excellent!";
  } else if (correctAnswers >= totalQuestions / 2) {
    message.textContent = "🔥 Great Job! Keep Practicing!";
  } else {
    message.textContent = "💜 Good Try! Practice More!";
  }

  if (!currentUser) {
    message.textContent += " Login to save your score.";
    return;
  }

  saveScore();
}

function goHome() {
  document.getElementById("quizSection").style.display = "none";
  document.getElementById("resultSection").style.display = "none";
  document.getElementById("homeSection").style.display = "block";

  loadLeaderboard();
}
  
// SAVE PLAYER SCORE

function saveScore() {
  if (!currentUser || scoreSaveStarted) return;

  scoreSaveStarted = true;

  const playerName = (
    currentUser.displayName || "Player"
  ).trim().substring(0, 20) || "Player";

  const playerRef = database.ref(
    "leaderboard/" + currentUser.uid
  );

  playerRef.transaction((currentData) => {
    if (currentData === null) {
      return {
        uid: currentUser.uid,
        name: playerName,
        points: score
      };
    }

    if (typeof currentData !== "object") {
      return;
    }

    return {
      uid: currentUser.uid,
      name: playerName,
      points: (Number(currentData.points) || 0) + score
    };

  }, (error, committed) => {
    const message = document.getElementById("resultMessage");

    if (error) {
      scoreSaveStarted = false;
      message.textContent =
        "Score Save Error: " + error.message;

    } else if (!committed) {
      scoreSaveStarted = false;
      message.textContent =
        "Score could not be saved. Please try again.";

    } else {
      message.textContent +=
        " 🏆 Score saved to Global Leaderboard!";

      loadLeaderboard();
    }
  });
}


// LOAD GLOBAL LEADERBOARD

function loadLeaderboard() {
  const list = document.getElementById("leaderboardList");

  if (!list) return;

  list.textContent = "Loading Leaderboard...";

  database.ref("leaderboard")
    .orderByChild("points")
    .limitToLast(10)
    .once("value")

    .then((snapshot) => {
      const players = [];

      snapshot.forEach((child) => {
        const player = child.val();

        if (player && typeof player === "object") {
          players.push(player);
        }
      });

      players.sort((a, b) =>
        (Number(b.points) || 0) -
        (Number(a.points) || 0)
      );

      list.innerHTML = "";

      if (players.length === 0) {
        const empty = document.createElement("div");
        empty.className = "leaderboard-empty";
        empty.textContent =
          "🏆 No Champions Yet! Play the First Quiz!";
        list.appendChild(empty);
        return;
      }

      const medals = ["🥇", "🥈", "🥉"];

      players.forEach((player, index) => {
        const row = document.createElement("div");

        row.className =
          "leaderboard-player rank-" + (index + 1);

        const rank = document.createElement("div");
        rank.className = "leaderboard-rank";
        rank.textContent =
          medals[index] || "#" + (index + 1);

        const info = document.createElement("div");
        info.className = "leaderboard-info";

        const name = document.createElement("div");
        name.className = "leaderboard-name";
        name.textContent = player.name || "Player";

        const position = document.createElement("div");
        position.className = "leaderboard-position";

        if (index === 0) {
          position.textContent = "👑 GRAND CHAMPION";
        } else if (index === 1) {
          position.textContent = "🥈 SILVER CHAMPION";
        } else if (index === 2) {
          position.textContent = "🥉 BRONZE CHAMPION";
        } else {
          position.textContent = "QUIZ PLAYER";
        }

        info.appendChild(name);
        info.appendChild(position);

        const points = document.createElement("div");
        points.className = "leaderboard-points";
        points.textContent =
          (Number(player.points) || 0) + " PTS";

        row.appendChild(rank);
        row.appendChild(info);
        row.appendChild(points);

        list.appendChild(row);
      });
    })

    .catch((error) => {
      console.error("Leaderboard Error:", error);

      list.textContent =
        "Leaderboard Load Failed: " + error.message;
    });
}

auth.onAuthStateChanged((user) => {
  currentUser = user;

  const loginArea = document.getElementById("loginArea");

  const userInfo = document.getElementById("userInfo");

  if (user) {
    loginArea.style.display = "none";
    logoutArea.style.display = "block";

    userInfo.textContent =
      "Welcome, " + (user.displayName || "Player");

  } else {
    loginArea.style.display = "block";
    logoutArea.style.display = "none";

    userInfo.textContent = "";
  }

  loadLeaderboard();
});
