const categories = [
["Free Fire","🔥 FREE FIRE"],
["Free Fire India","🇮🇳 FREE FIRE INDIA"],
["Cricket","🏏 CRICKET"],
["BTS","💜 BTS"],
["Movies","🎬 MOVIES"],
["GK","🌍 GENERAL KNOWLEDGE"]
];

let category="";
let level="";
let index=0;
let score=0;
let right=0;
let quizQuestions=[];
let answered=false;

const catBox=document.getElementById("categories");
categories.forEach(([key,label])=>{
 const b=document.createElement("button");
 b.className="category";
 b.textContent=label;
 b.onclick=()=>{
  category=key;
  document.querySelectorAll(".category").forEach(x=>x.classList.remove("selected"));
  b.classList.add("selected");
  updateSelection();
 };
 catBox.appendChild(b);
});

function setLevel(l,b){
 level=l;
 document.querySelectorAll(".level").forEach(x=>x.classList.remove("selected"));
 b.classList.add("selected");
 updateSelection();
}
function updateSelection(){
 document.getElementById("selection").textContent=
 (category||"Category नहीं चुनी")+" | "+(level||"Level नहीं चुना");
}
function startQuiz(){
 const name=document.getElementById("playerName").value.trim();
 if(!name){alert("पहले अपना नाम लिखो!");return}
 if(!category||!level){alert("Category और Level दोनों चुनो!");return}
 quizQuestions=[...bank[category][level]].sort(()=>Math.random()-.5);
 index=0;score=0;right=0;
 document.getElementById("home").classList.add("hidden");
 document.getElementById("result").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");
 showQuestion();
}
function showQuestion(){
 answered=false;
 const q=quizQuestions[index];
 document.getElementById("quizInfo").textContent=
 category+" | "+level+" | प्रश्न "+(index+1)+"/20";
 document.getElementById("question").textContent=q[0];
 document.getElementById("feedback").textContent="";
 document.getElementById("next").classList.add("hidden");
 const box=document.getElementById("options");
 box.innerHTML="";
 for(let i=1;i<=4;i++){
  const b=document.createElement("button");
  b.className="option";
  b.textContent=String.fromCharCode(64+i)+". "+q[i];
  b.onclick=()=>answer(i-1,b);
  box.appendChild(b);
 }
}
function answer(choice,button){
 if(answered)return;
 answered=true;
 const q=quizQuestions[index];
 document.querySelectorAll(".option").forEach((b,i)=>{
  b.disabled=true;
  if(i===q[5])b.classList.add("correct");
 });
 if(choice===q[5]){
  score+=10;right++;
  document.getElementById("feedback").textContent="✅ सही जवाब! +10 Points";
 }else{
  button.classList.add("wrong");
  document.getElementById("feedback").textContent="❌ गलत जवाब! 0 Points";
 }
 document.getElementById("next").classList.remove("hidden");
}
function nextQuestion(){
 index++;
 if(index<quizQuestions.length){showQuestion();return}
 finishQuiz();
}

// एक खिलाड़ी का नाम केवल एक बार, पुराने अंकों में नए अंक जोड़ना।
function finishQuiz(){
 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");
 document.getElementById("finalScore").textContent="⭐ "+score+" POINTS";
 document.getElementById("rightAnswers").textContent=
 "सही जवाब: "+right+" / "+quizQuestions.length;

 const name=document.getElementById("playerName").value.trim();
 let board=JSON.parse(localStorage.getItem("gspBoard")||"[]");
 let player=board.find(p=>p.name.toLowerCase()===name.toLowerCase());

 if(player){
  player.points+=score;
  player.name=name;
 }else{
  board.push({name:name,points:score});
 }
 board.sort((a,b)=>b.points-a.points);
 board=board.slice(0,10);
 localStorage.setItem("gspBoard",JSON.stringify(board));
 renderBoard();
}
function renderBoard(){
 const board=JSON.parse(localStorage.getItem("gspBoard")||"[]");
 const body=document.getElementById("leaderboard");
 body.innerHTML="";
 if(!board.length){
  body.innerHTML="<tr><td colspan='3'>अभी कोई खिलाड़ी नहीं है</td></tr>";
  return;
 }
 board.forEach((p,i)=>{
  const tr=document.createElement("tr");
  [i===0?"🥇":i===1?"🥈":i===2?"🥉":i+1,p.name,p.points+" pts"].forEach(v=>{
   const td=document.createElement("td");
   td.textContent=v;
   tr.appendChild(td);
  });
  body.appendChild(tr);
 });
}
function goHome(){
 document.getElementById("result").classList.add("hidden");
 document.getElementById("home").classList.remove("hidden");
}
renderBoard();
